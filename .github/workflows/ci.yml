name: ci

on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked runtime
        run: python -m pip install -e ".[api,image,dev]"
      - name: Unit and router regression tests
        run: python -m pytest
      - name: Score-router smoke
        run: python tools/fresh_env_smoke.py
