[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluoro-mvp-delivery"
version = "0.2.0"
description = "Backend-ready delivery package for the FLG/CXR MVP model candidate."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.0.2",
  "pandas==2.2.3",
  "pillow==12.0.0",
  "scikit-learn==1.8.0",
  "joblib==1.5.3",
  "safetensors==0.7.0",
]

[project.optional-dependencies]
api = ["fastapi==0.115.6", "uvicorn==0.30.6", "python-multipart==0.0.22"]
image = [
  "torch==2.8.0",
  "timm==0.9.0",
  "fvcore==0.1.5.post20221221",
  "iopath==0.1.10",
  "omegaconf==2.3.0",
  "pydicom==3.0.2",
]
dev = ["pytest==8.3.3", "pytest-asyncio==0.24.0", "httpx==0.27.2"]

[project.scripts]
fluoro-mvp-infer = "fluoro_mvp_backend.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
